<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iodine Clock Reaction Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white relative">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Kinetics Engine & Constants ---
    const K_BASE_298 = 0.0225; // rate constant at 25 °C (298.15 K)
    const EA = 52000;          // Activation energy in J/mol
    const R_GAS = 8.314;       // Gas constant in J/(mol·K)
    const T_REF = 298.15;      // Reference temperature in K
    const DEFAULT_THIOSULFATE_CONC = 0.0010; // [S2O3^2-] in M

    function getRateConstant(temperatureCelsius) {
      const T = temperatureCelsius + 273.15;
      return K_BASE_298 * Math.exp((-EA / R_GAS) * ((1 / T) - (1 / T_REF)));
    }

    function calculateReactionTime(h2o2, iodide, acid, tempC, withJitter = true, thiosulfate = DEFAULT_THIOSULFATE_CONC) {
      const k = getRateConstant(tempC);
      // Rate law: Rate = k [H2O2]^1 [I-]^1 [H+]^0
      const theoreticalRate = k * h2o2 * iodide;
      
      // S2O3^2- stoichiometry: Rate = Δ[I2]/Δt = [S2O3^2-] / (2 * t)
      let calculatedTime = thiosulfate / (2 * theoreticalRate);
      
      if (withJitter) {
        // Experimental jitter (±1.5%)
        const jitter = (Math.random() * 0.03) - 0.015;
        calculatedTime = calculatedTime * (1 + jitter);
      }
      
      calculatedTime = Math.max(0.2, calculatedTime);
      const measuredRate = thiosulfate / (2 * calculatedTime);
      const kCalculated = measuredRate / (h2o2 * iodide);
      
      return {
        time: Math.round(calculatedTime * 100) / 100,
        rate: measuredRate,
        k: kCalculated
      };
    }

    // Audio synthesizer for audio-visual feedback
    function playAudioTone(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'beep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'complete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {
        // Autoplay restrictions
      }
    }

    // --- Main App Component ---
    function App() {
      const [reactants, setReactants] = useState({
        h2o2: 0.050,
        iodide: 0.050,
        acid: 0.050,
        temperature: 25.0,
        thiosulfate: DEFAULT_THIOSULFATE_CONC,
      });

      const [isRunning, setIsRunning] = useState(false);
      const [isComplete, setIsComplete] = useState(false);
      const [elapsedTime, setElapsedTime] = useState(0);
      const [expectedTime, setExpectedTime] = useState(11.11);
      const [speedMultiplier, setSpeedMultiplier] = useState(1);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [addJitter, setAddJitter] = useState(true);
      const [trials, setTrials] = useState([]);
      const [selectedTrialIds, setSelectedTrialIds] = useState([]);

      // Deduction state
      const [orderH2O2, setOrderH2O2] = useState('');
      const [orderIodide, setOrderIodide] = useState('');
      const [orderAcid, setOrderAcid] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isCorrect, setIsCorrect] = useState(null);
      const [feedbackNotes, setFeedbackNotes] = useState([]);

      const activeTrialExpectedTimeRef = useRef(11.11);
      const trialParamsRef = useRef(reactants);
      const hasCompletedRef = useRef(false);

      const completeTrial = useCallback((finalTime) => {
        if (hasCompletedRef.current) return;
        hasCompletedRef.current = true;

        setIsRunning(false);
        setIsComplete(true);
        setElapsedTime(finalTime);

        if (soundEnabled) {
          playAudioTone('complete');
        }

        const currentParams = trialParamsRef.current;
        const initialRate = currentParams.thiosulfate / (2 * finalTime);
        const relativeRate = 1 / finalTime;
        const kCalc = initialRate / (currentParams.h2o2 * currentParams.iodide);

        setTrials((prev) => {
          const newTrial = {
            id: 'trial-' + Date.now(),
            trialNumber: prev.length + 1,
            h2o2: currentParams.h2o2,
            iodide: currentParams.iodide,
            acid: currentParams.acid,
            temperature: currentParams.temperature,
            timeElapsed: Math.round(finalTime * 100) / 100,
            relativeRate,
            initialRate,
            kCalculated: kCalc,
            timestamp: new Date().toLocaleTimeString(),
          };
          const next = [...prev, newTrial];
          setSelectedTrialIds((prevSelected) => {
            if (prevSelected.length < 2) {
              if (next.length >= 2) return [next[next.length - 2].id, next[next.length - 1].id];
              return [next[0].id];
            }
            return prevSelected;
          });
          return next;
        });
      }, [soundEnabled]);

      const handleStart = () => {
        if (isRunning) return;
        hasCompletedRef.current = false;
        setIsRunning(true);
        setIsComplete(false);
        setElapsedTime(0);

        if (soundEnabled) playAudioTone('beep');

        trialParamsRef.current = { ...reactants };
        const result = calculateReactionTime(
          reactants.h2o2,
          reactants.iodide,
          reactants.acid,
          reactants.temperature,
          addJitter,
          reactants.thiosulfate
        );

        setExpectedTime(result.time);
        activeTrialExpectedTimeRef.current = result.time;
      };

      const handleReset = () => {
        hasCompletedRef.current = false;
        setIsRunning(false);
        setIsComplete(false);
        setElapsedTime(0);
      };

      const handleFastForward = () => {
        if (!isRunning || hasCompletedRef.current) return;
        completeTrial(activeTrialExpectedTimeRef.current);
      };

      // Timer Loop
      useEffect(() => {
        let timer;
        if (isRunning) {
          const intervalMs = 50;
          timer = setInterval(() => {
            setElapsedTime((prevTime) => {
              const nextTime = prevTime + (intervalMs / 1000) * speedMultiplier;
              if (nextTime >= activeTrialExpectedTimeRef.current) {
                return activeTrialExpectedTimeRef.current;
              }
              return nextTime;
            });
          }, intervalMs);
        }
        return () => clearInterval(timer);
      }, [isRunning, speedMultiplier]);

      useEffect(() => {
        if (isRunning && elapsedTime >= expectedTime && expectedTime > 0 && !hasCompletedRef.current) {
          completeTrial(expectedTime);
        }
      }, [isRunning, elapsedTime, expectedTime, completeTrial]);

      // Comparison Tool Logic
      const selectedTrials = trials.filter((t) => selectedTrialIds.includes(t.id));
      const trialA = selectedTrials[0] || trials[0];
      const trialB = selectedTrials[1] || trials[1];

      let comparisonAnalysis = null;
      if (trialA && trialB && trialA.id !== trialB.id) {
        const ratioH2O2 = trialB.h2o2 / trialA.h2o2;
        const ratioIodide = trialB.iodide / trialA.iodide;
        const ratioAcid = trialB.acid / trialA.acid;
        const ratioRate = trialB.initialRate / trialA.initialRate;

        let variedReactant = '';
        let concRatio = 1;
        let reactantSymbol = '';

        if (Math.abs(ratioIodide - 1) < 0.01 && Math.abs(ratioAcid - 1) < 0.01 && Math.abs(ratioH2O2 - 1) > 0.05) {
          variedReactant = '[H₂O₂]';
          reactantSymbol = 'm';
          concRatio = ratioH2O2;
        } else if (Math.abs(ratioH2O2 - 1) < 0.01 && Math.abs(ratioAcid - 1) < 0.01 && Math.abs(ratioIodide - 1) > 0.05) {
          variedReactant = '[I⁻]';
          reactantSymbol = 'n';
          concRatio = ratioIodide;
        } else if (Math.abs(ratioH2O2 - 1) < 0.01 && Math.abs(ratioIodide - 1) < 0.01 && Math.abs(ratioAcid - 1) > 0.05) {
          variedReactant = '[H⁺]';
          reactantSymbol = 'p';
          concRatio = ratioAcid;
        }

        comparisonAnalysis = {
          trialANum: trialA.trialNumber,
          trialBNum: trialB.trialNumber,
          variedReactant,
          reactantSymbol,
          concRatio,
          ratioRate,
          isIsolated: Boolean(variedReactant),
        };
      }

      const handleVerifyDeduction = () => {
        const m = parseInt(orderH2O2, 10);
        const n = parseInt(orderIodide, 10);
        const p = parseInt(orderAcid, 10);

        const isH2O2Ok = m === 1;
        const isIodideOk = n === 1;
        const isAcidOk = p === 0;

        const notes = [];
        if (!isH2O2Ok) notes.push('Recheck [H₂O₂]: Doubling [H₂O₂] halves the time (doubles the initial rate) → Order m = 1.');
        if (!isIodideOk) notes.push('Recheck [I⁻]: Doubling [I⁻] halves the time (doubles the initial rate) → Order n = 1.');
        if (!isAcidOk) notes.push('Recheck [H⁺]: Varying acid concentration does not change reaction time → Order p = 0.');

        const allOk = isH2O2Ok && isIodideOk && isAcidOk;
        setIsCorrect(allOk);
        setFeedbackNotes(notes);
        setIsSubmitted(true);

        if (allOk && window.confetti) {
          window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.65 } });
        }
      };

      const exportCSV = () => {
        if (trials.length === 0) return;
        const headers = "Trial Number,H2O2 (M),Iodide (M),Acid (M),Temperature (C),Time (s),Relative Rate (1/s),Initial Rate (M/s)\n";
        const rows = trials.map(t => `${t.trialNumber},${t.h2o2},${t.iodide},${t.acid},${t.temperature},${t.timeElapsed},${t.relativeRate},${t.initialRate}`).join("\n");
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'iodine_clock_kinetics_data.csv';
        a.click();
        window.URL.revokeObjectURL(url);
      };

      const progressFraction = expectedTime > 0 ? Math.min(1, elapsedTime / expectedTime) : 0;

      // Color calculation for flask
      let fluidColor = "rgba(224, 242, 254, 0.4)";
      if (isComplete) {
        fluidColor = "rgba(10, 18, 50, 0.96)";
      } else if (progressFraction > 0.92) {
        const factor = (progressFraction - 0.92) / 0.08;
        fluidColor = `rgba(${Math.round(224 - factor * (224 - 10))}, ${Math.round(242 - factor * (242 - 18))}, ${Math.round(254 - factor * (254 - 50))}, ${0.4 + factor * 0.56})`;
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col pb-16">
          {/* Top Bar */}
          <header className="border-b border-slate-800 bg-slate-950/80 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-lg sm:text-xl font-bold text-sky-400 tracking-tight flex items-center gap-2">
                <span>⚗️</span> Iodine Clock Reaction Virtual Lab
              </h1>
              <p className="text-xs text-slate-400">
                Method of Initial Rates: H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O
              </p>
            </div>
            <div className="flex items-center gap-3 text-xs">
              <label className="flex items-center gap-1.5 cursor-pointer text-slate-300">
                <input
                  type="checkbox"
                  checked={soundEnabled}
                  onChange={(e) => setSoundEnabled(e.target.checked)}
                  className="rounded border-slate-700 bg-slate-800 text-sky-500"
                />
                Audio Feedback
              </label>
            </div>
          </header>

          {/* Main Grid Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Bench Visualizer & Timer */}
            <div className="lg:col-span-5 flex flex-col gap-6">
              {/* Flask Visualizer Card */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col items-center justify-center shadow-lg relative overflow-hidden">
                <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  Reaction Vessel
                </div>

                <div className="w-64 h-64 relative flex items-center justify-center">
                  <svg viewBox="0 0 320 380" className="w-full h-full drop-shadow-md">
                    <defs>
                      <clipPath id="flaskClip">
                        <path d="M 125,25 L 125,120 L 40,320 C 35,335 45,350 70,350 L 250,350 C 275,350 285,335 280,320 L 195,120 L 195,25 Z" />
                      </clipPath>
                    </defs>

                    {/* Liquid fill */}
                    <g clipPath="url(#flaskClip)">
                      <rect x="0" y="160" width="320" height="220" fill={fluidColor} className="transition-colors duration-200" />
                    </g>

                    {/* Glass Outline */}
                    <path
                      d="M 125,25 L 125,120 L 40,320 C 35,335 45,350 70,350 L 250,350 C 275,350 285,335 280,320 L 195,120 L 195,25 Z"
                      fill="none"
                      stroke="#94a3b8"
                      strokeWidth="5"
                      strokeLinecap="round"
                    />
                    <ellipse cx="160" cy="25" rx="35" ry="7" fill="none" stroke="#94a3b8" strokeWidth="5" />
                    {/* Measurement graduation lines */}
                    <line x1="105" y1="200" x2="135" y2="200" stroke="#64748b" strokeWidth="2" />
                    <line x1="85" y1="250" x2="120" y2="250" stroke="#64748b" strokeWidth="2" />
                    <line x1="65" y1="300" x2="105" y2="300" stroke="#64748b" strokeWidth="2" />
                  </svg>
                </div>

                {/* Status Indicator */}
                <div className={`mt-3 px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${
                  isComplete
                    ? 'bg-blue-950 text-sky-200 border border-blue-600 shadow-md shadow-blue-900/50'
                    : isRunning
                    ? 'bg-cyan-950 text-cyan-300 border border-cyan-700 animate-pulse'
                    : 'bg-slate-800 text-slate-400'
                }`}>
                  {isComplete ? '🔵 Endpoint Reached: Dark Blue Complex' : isRunning ? '⚡ Reaction in Progress (Clear)' : 'Ready for Reagents'}
                </div>

                <p className="mt-2 text-[11px] text-slate-400 text-center max-w-xs">
                  {isComplete
                    ? 'All S₂O₃²⁻ is consumed → excess I₂ instantly binds with starch'
                    : isRunning
                    ? 'S₂O₃²⁻ reduces I₂ back to I⁻ rapidly, keeping solution clear'
                    : 'Adjust concentrations on the right and click Start'}
                </p>
              </div>

              {/* Stopwatch & Speed Controls */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">
                    Digital Stopwatch
                  </span>
                  <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-800">
                    {[1, 2, 5].map((speed) => (
                      <button
                        key={speed}
                        type="button"
                        onClick={() => setSpeedMultiplier(speed)}
                        className={`px-2.5 py-0.5 text-xs font-semibold rounded ${
                          speedMultiplier === speed ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        {speed}x
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-xl text-center border border-slate-800">
                  <div className="font-mono text-4xl sm:text-5xl font-extrabold text-sky-400 tracking-wider">
                    {elapsedTime.toFixed(2)} <span className="text-xl text-slate-400">s</span>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={handleStart}
                    disabled={isRunning}
                    className={`py-2.5 px-3 rounded-xl text-xs font-bold shadow transition-all ${
                      isRunning
                        ? 'bg-slate-800 text-slate-600 cursor-not-allowed'
                        : 'bg-sky-600 hover:bg-sky-500 text-white cursor-pointer active:scale-95'
                    }`}
                  >
                    ▶ Mix & Start
                  </button>
                  <button
                    type="button"
                    onClick={handleFastForward}
                    disabled={!isRunning}
                    className={`py-2.5 px-3 rounded-xl text-xs font-bold border transition-all ${
                      !isRunning
                        ? 'border-slate-800 text-slate-700 cursor-not-allowed'
                        : 'border-amber-700 bg-amber-950/40 text-amber-300 hover:bg-amber-900/60 cursor-pointer active:scale-95'
                    }`}
                  >
                    ⏩ Fast-Forward
                  </button>
                  <button
                    type="button"
                    onClick={handleReset}
                    className="py-2.5 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all active:scale-95"
                  >
                    🔄 Reset
                  </button>
                </div>
              </div>
            </div>

            {/* Right Column: Controls, Data Table & Deduction */}
            <div className="lg:col-span-7 flex flex-col gap-6">
              
              {/* Reactant Sliders */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h2 className="text-sm font-bold text-white tracking-tight">
                      Reactant Concentrations & Conditions
                    </h2>
                    <p className="text-xs text-slate-400">
                      Manipulate molarities independently to isolate reaction orders
                    </p>
                  </div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={addJitter}
                      onChange={(e) => setAddJitter(e.target.checked)}
                      disabled={isRunning}
                      className="rounded border-slate-700 bg-slate-800 text-sky-500"
                    />
                    <span>Uncertainty (±1.5%)</span>
                  </label>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* [H2O2] */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-cyan-400">[H₂O₂] Peroxide</span>
                      <span className="font-mono bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800">
                        {reactants.h2o2.toFixed(3)} M
                      </span>
                    </div>
                    <input
                      type="range"
                      min="0.010"
                      max="0.200"
                      step="0.005"
                      value={reactants.h2o2}
                      disabled={isRunning}
                      onChange={(e) => setReactants({ ...reactants, h2o2: parseFloat(e.target.value) })}
                      className="w-full accent-cyan-500"
                    />
                  </div>

                  {/* [I-] */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-indigo-400">[I⁻] Iodide</span>
                      <span className="font-mono bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800">
                        {reactants.iodide.toFixed(3)} M
                      </span>
                    </div>
                    <input
                      type="range"
                      min="0.010"
                      max="0.200"
                      step="0.005"
                      value={reactants.iodide}
                      disabled={isRunning}
                      onChange={(e) => setReactants({ ...reactants, iodide: parseFloat(e.target.value) })}
                      className="w-full accent-indigo-500"
                    />
                  </div>

                  {/* [H+] */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-amber-400">[H⁺] Acid</span>
                      <span className="font-mono bg-amber-950 text-amber-300 px-2 py-0.5 rounded border border-amber-800">
                        {reactants.acid.toFixed(3)} M
                      </span>
                    </div>
                    <input
                      type="range"
                      min="0.010"
                      max="0.200"
                      step="0.005"
                      value={reactants.acid}
                      disabled={isRunning}
                      onChange={(e) => setReactants({ ...reactants, acid: parseFloat(e.target.value) })}
                      className="w-full accent-amber-500"
                    />
                  </div>

                  {/* Temp */}
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-rose-400">Temperature (T)</span>
                      <span className="font-mono bg-rose-950 text-rose-300 px-2 py-0.5 rounded border border-rose-800">
                        {reactants.temperature.toFixed(1)} °C
                      </span>
                    </div>
                    <input
                      type="range"
                      min="10"
                      max="50"
                      step="1"
                      value={reactants.temperature}
                      disabled={isRunning}
                      onChange={(e) => setReactants({ ...reactants, temperature: parseFloat(e.target.value) })}
                      className="w-full accent-rose-500"
                    />
                  </div>
                </div>
              </div>

              {/* Data Table */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between flex-wrap gap-2">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    Recorded Experimental Trials ({trials.length})
                  </h3>
                  {trials.length > 0 && (
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={exportCSV}
                        className="px-3 py-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-semibold transition-all"
                      >
                        📥 Export CSV
                      </button>
                      <button
                        type="button"
                        onClick={() => { setTrials([]); setSelectedTrialIds([]); }}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-300 rounded-lg text-xs font-semibold transition-all"
                      >
                        Clear
                      </button>
                    </div>
                  )}
                </div>

                <div className="overflow-x-auto max-h-56">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 font-semibold border-b border-slate-800 sticky top-0">
                      <tr>
                        <th className="p-2.5 text-center">Compare</th>
                        <th className="p-2.5">Trial</th>
                        <th className="p-2.5">[H₂O₂]</th>
                        <th className="p-2.5">[I⁻]</th>
                        <th className="p-2.5">[H⁺]</th>
                        <th className="p-2.5">Time (s)</th>
                        <th className="p-2.5">Rate (M·s⁻¹)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 font-mono">
                      {trials.length === 0 ? (
                        <tr>
                          <td colSpan={7} className="p-6 text-center text-slate-500 font-sans">
                            No trials recorded yet. Click "Mix & Start" to run your first experiment.
                          </td>
                        </tr>
                      ) : (
                        trials.map((t) => {
                          const isSelected = selectedTrialIds.includes(t.id);
                          return (
                            <tr key={t.id} className={isSelected ? 'bg-sky-950/60 text-sky-200' : 'hover:bg-slate-900/50'}>
                              <td className="p-2.5 text-center">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={() => {
                                    setSelectedTrialIds((prev) =>
                                      prev.includes(t.id) ? prev.filter((id) => id !== t.id) : [...prev, t.id]
                                    );
                                  }}
                                  className="rounded border-slate-700 bg-slate-800 text-sky-500"
                                />
                              </td>
                              <td className="p-2.5 font-bold">#{t.trialNumber}</td>
                              <td className="p-2.5 text-cyan-300">{t.h2o2.toFixed(3)}</td>
                              <td className="p-2.5 text-indigo-300">{t.iodide.toFixed(3)}</td>
                              <td className="p-2.5 text-amber-300">{t.acid.toFixed(3)}</td>
                              <td className="p-2.5 text-sky-300 font-bold">{t.timeElapsed.toFixed(2)}</td>
                              <td className="p-2.5 text-emerald-400">{t.initialRate.toExponential(2)}</td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Deduction Workspace */}
              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                <div className="border-b border-slate-800 pb-2">
                  <h3 className="text-sm font-bold text-white">
                    Rate Law Deduction Workspace
                  </h3>
                  <p className="text-xs text-slate-400">
                    Formula: <span className="text-sky-300 font-mono font-semibold">Rate = k [H₂O₂]ᵐ [I⁻]ⁿ [H⁺]ᵖ</span>
                  </p>
                </div>

                {/* Selected Trials Isolation Helper */}
                {comparisonAnalysis && comparisonAnalysis.isIsolated && (
                  <div className="bg-sky-950/40 border border-sky-800/80 rounded-xl p-3 text-xs space-y-1">
                    <div className="font-semibold text-sky-300">
                      Comparing Trial #{comparisonAnalysis.trialANum} and Trial #{comparisonAnalysis.trialBNum}:
                    </div>
                    <div className="font-mono text-slate-300">
                      • {comparisonAnalysis.variedReactant} varied by factor of <strong className="text-white">{comparisonAnalysis.concRatio.toFixed(2)}x</strong>
                    </div>
                    <div className="font-mono text-slate-300">
                      • Rate changed by factor of <strong className="text-white">{comparisonAnalysis.ratioRate.toFixed(2)}x</strong>
                    </div>
                    <div className="text-[11px] text-sky-400 pt-1 font-mono">
                      Equation: {comparisonAnalysis.ratioRate.toFixed(2)} = ({comparisonAnalysis.concRatio.toFixed(2)})<sup>{comparisonAnalysis.reactantSymbol}</sup>
                    </div>
                  </div>
                )}

                {/* Order Selector Inputs */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      Order for [H₂O₂] (m):
                    </label>
                    <select
                      value={orderH2O2}
                      onChange={(e) => setOrderH2O2(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value="">Select m...</option>
                      <option value="0">0 (Zero)</option>
                      <option value="1">1 (First)</option>
                      <option value="2">2 (Second)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      Order for [I⁻] (n):
                    </label>
                    <select
                      value={orderIodide}
                      onChange={(e) => setOrderIodide(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value="">Select n...</option>
                      <option value="0">0 (Zero)</option>
                      <option value="1">1 (First)</option>
                      <option value="2">2 (Second)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      Order for [H⁺] (p):
                    </label>
                    <select
                      value={orderAcid}
                      onChange={(e) => setOrderAcid(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value="">Select p...</option>
                      <option value="0">0 (Zero)</option>
                      <option value="1">1 (First)</option>
                      <option value="2">2 (Second)</option>
                    </select>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    type="button"
                    onClick={handleVerifyDeduction}
                    disabled={orderH2O2 === '' || orderIodide === '' || orderAcid === ''}
                    className={`px-4 py-2 text-xs font-semibold rounded-xl text-white transition-all ${
                      orderH2O2 === '' || orderIodide === '' || orderAcid === ''
                        ? 'bg-slate-800 text-slate-600 cursor-not-allowed'
                        : 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer active:scale-95'
                    }`}
                  >
                    ✨ Verify My Rate Law
                  </button>

                  {isSubmitted && (
                    <span className={`text-xs font-semibold px-3 py-1.5 rounded-lg ${
                      isCorrect ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'
                    }`}>
                      {isCorrect ? '✓ Correct Rate Law!' : '✗ Orders Need Review'}
                    </span>
                  )}
                </div>

                {isSubmitted && !isCorrect && feedbackNotes.length > 0 && (
                  <div className="bg-rose-950/40 border border-rose-900 rounded-lg p-3 text-xs text-rose-300 space-y-1">
                    {feedbackNotes.map((note, i) => (
                      <div key={i}>• {note}</div>
                    ))}
                  </div>
                )}
              </div>

            </div>
          </main>

          {/* Floating Back to Home button in the Bottom-Left Corner */}
          <div className="fixed bottom-5 left-5 z-50">
            <a
              href="#"
              onClick={(e) => {
                if (e.currentTarget.getAttribute('href') === '#') {
                  e.preventDefault();
                  if (window.history.length > 1) {
                    window.history.back();
                  } else {
                    window.location.href = '/';
                  }
                }
              }}
              className="flex items-center gap-2 px-4 py-2.5 rounded-full bg-slate-950/90 hover:bg-slate-900 text-slate-100 hover:text-white border border-slate-700/90 shadow-xl hover:shadow-2xl text-xs font-bold backdrop-blur-md transition-all hover:scale-105 active:scale-95 group"
              id="bottom-left-home-btn"
              title="Back to Home"
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-sky-400 group-hover:-translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <span>Back to Home</span>
            </a>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
